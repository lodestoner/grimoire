; Grimoire recipes — each [section] is a recipe; steps run left to right.
; Step keys: any transform key (clean, join, title, sentence, curly, straight,
;   emdash, ellipsis, deaccent, dblspace, slug, snake, kebab, sortaz, unique,
;   trimlines, numberlines, b64enc, urlenc, ...) OR a Claude step:
;   grammar, tighten, clarity, headline, housestyle
; Result opens in a review window (Replace / Copy / Close).

[Polish prose]
steps=clean,grammar,curly,emdash

[Tighten + house style]
steps=clean,housestyle

[Code cleanup]
steps=housestyle

[Plain and simple]
steps=straight,dblspace,clean
