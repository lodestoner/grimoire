; Grimoire custom spells. Each [section] is one spell. Three kinds:
;
;   type=prompt    an AI instruction. Keys: prompt=, mode=replace|show|review, style=none|auto|prose|code, role=quick|precise
;                  The highlighted text is appended after the instruction, or put {text} where you want it.
;   type=command   a shell command (cmd.exe). The text arrives on stdin and in %SPELL_TEXT%; {file} / %SPELL_FILE% for file spells.
;                  Keys: command=, mode=show|replace|review
;   type=http      an HTTP call. Keys: url=, method=POST|GET, headers=Key: value|Key2: value2, body=  (placeholders {text} {json} {file} {filename}), show=1 to display the reply
;
;   files=1        puts the spell in the FILE menu (runs per selected file) instead of the text menu.
;   Use \n for line breaks inside a value.

[Explain like I'm 8]
type=prompt
prompt=Explain this for a curious 8-year-old in three short, friendly sentences. Output only the explanation.
mode=show

[TL;DR for chat]
type=prompt
prompt=Summarize this in two sentences a busy teammate can read in chat, then one line starting with "Ask:" if there is anything to decide or do. Output only that.
mode=show

[Reply politely]
type=prompt
prompt=Draft a short, polite reply to this message. Keep it under 80 words, friendly and specific. Output only the reply.
mode=review
style=prose

[Make it a checklist]
type=prompt
prompt=Turn this into a Markdown checklist of concrete steps, one action per line, in the right order. Output only the checklist.
mode=review

; --- examples of the other kinds (edit the URLs, then remove the leading ';' from the section header to enable) ---
;[Send to webhook]
;type=http
;url=https://example.com/hook
;method=POST
;headers=Content-Type: application/json
;body={"text": {json}}
;show=0

;[Word frequency (PowerShell)]
;type=command
;command=pwsh -NoProfile -Command "$input | Out-String | ForEach-Object { $_ -split '\W+' } | Where-Object { $_ } | Group-Object | Sort-Object Count -Descending | Select-Object -First 15 | ForEach-Object { '{0,4}  {1}' -f $_.Count, $_.Name }"
;mode=show
